[package]
name = "BitForge"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.34"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["full"] }
hyper = "1.11.1"
toml = "1.1.6"
env_logger = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
rust-embed = { version = "8.12.0", features = ["compression"] }
hyper-util = { version = "0.1.20", features = ["full"] }
http-body-util = "0.1.5"
futures-util = "0.3.34"
git2 = { version = "0.21.0", features = ["https", "vendored-openssl"] }
bytes = "1.12.1"
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
xml-rs = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
